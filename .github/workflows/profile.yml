name: profile

on:
  schedule: [{cron: "17 2 * * *"}]
  push: {branches: [master], paths: ["scripts/**", ".github/workflows/profile.yml"]}
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --quiet --cached || git commit -m "chore: refresh profile cards"
          git push

  snake:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark&color_snake=#a371f7
      - uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: output, build_dir: dist}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
